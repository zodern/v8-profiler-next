name: Continuous integration
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest          # linux x64
          - ubuntu-24.04-arm       # linux arm64
          - macos-latest           # darwin arm64
          - macos-13               # darwin x64
          - windows-latest         # win32 x64
        node-version: [ 14, 20, 22 ]
        exclude:
          - os: ubuntu-24.04-arm
            node-version: 14
          - os: macos-latest
            node-version: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 14 uses node-gyp v5. Its vendored gyp uses Python's 'rU'
      # open mode which was removed in Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.node-version == 14 && '3.10' || '3.11' }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Node 14's bundled node-gyp v5 doesn't recognize Visual Studio 2022
      # on windows-latest. Override with a modern node-gyp for that target.
      - name: Use modern node-gyp on Windows + Node 14
        if: matrix.os == 'windows-latest' && matrix.node-version == 14
        shell: bash
        run: |
          npm install -g node-gyp@9
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install
        run: npm install --foreground-scripts

      - name: Run tests
        run: npm run debug-test

      - name: Build prebuild
        run: npm run prebuild

      - name: Verify prebuild loads
        run: node scripts/verify-prebuild.js

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}-node${{ matrix.node-version }}
          path: prebuilds/**/*.node
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle all prebuilds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: .

      - name: List collected prebuilds
        run: ls -lR prebuilds

      - name: Create combined tarball
        run: tar -czf v8-profiler-next-prebuilds.tar.gz prebuilds

      - name: Upload combined tarball
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-bundle
          path: v8-profiler-next-prebuilds.tar.gz
          if-no-files-found: error
          retention-days: 30

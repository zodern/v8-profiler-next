name: Continuous integration
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  matrix:
    name: Create matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create matrix
        id: matrix
        run: echo "include=$(node scripts/ci-matrix.js)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 14 uses node-gyp v5. Its vendored gyp uses Python's 'rU'
      # open mode which was removed in Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Node 14's bundled node-gyp v5 doesn't recognize Visual Studio 2022
      # on windows-latest. Override with a modern node-gyp for that target.
      - name: Use modern node-gyp on Windows + Node 14
        if: runner.os == 'Windows' && matrix.node == 14
        shell: bash
        run: |
          npm install -g node-gyp@9
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install
        run: npm install --foreground-scripts

      - name: Run tests
        run: npm run debug-test

      - name: Build prebuild
        run: npm run prebuild

      # Some versions don't have a runner and are cross compiled
      # such as with the Node 14 arm build
      - name: Cross-compile prebuilds
        run: npm run prebuild-cross

      - name: Verify prebuild loads
        run: node scripts/verify-prebuild.js

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}-node${{ matrix.node }}
          path: prebuilds
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle all prebuilds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: prebuilds

      - name: List collected prebuilds
        run: ls -lR prebuilds

      - name: Verify the full set of prebuilds
        run: |
          npm install --ignore-scripts
          node scripts/verify-prebuilds.js

      - name: Create combined tarball
        run: tar -czf v8-profiler-next-prebuilds.tar.gz prebuilds

      - name: Upload combined tarball
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-bundle
          path: v8-profiler-next-prebuilds.tar.gz
          if-no-files-found: error
          retention-days: 30
